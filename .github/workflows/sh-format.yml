name: sh-format
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # W-REL1/R7: the sh-checker job is REMOVED, deliberately. It was
  # permanently red since July 2026: 29 shellcheck findings per
  # frun.bash copy x4 (frozen product — primer §4.1 idioms that must
  # NOT be "fixed"), plus BROKEN/, BENCHMARKS/, DOCS/ noise outside
  # every standing scope, plus shfmt style diffs on the live test
  # files whose reformatting at release-eve risks the 263-test
  # suite for zero product benefit. A permanently-false gate
  # destroys every other red's signal; a missing gate is better.
  # Format signal is retained where it is load-bearing: twin-check
  # below (byte lockstep) + review discipline per the primer.
  twin-check:
    # PF-1: file twins must stay in lockstep. frun.bash <->
    # ring_loadables/frun.nob64.bash carry different embedded-b64 payloads
    # by construction (a literal cmp would false-fail), so only the
    # pre-b64-marker region is compared; the comprehensive-suite twins are
    # byte-identical with no exceptions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: File twins in lockstep
        shell: bash
        run: |
          set -euo pipefail
          echo "frun twins in lockstep (pre-b64-marker region)"
          cmp <(awk '/_BASE64_START_/{exit} {print}' frun.bash) \
              <(awk '/_BASE64_START_/{exit} {print}' ring_loadables/frun.nob64.bash)
          echo "test twins byte-identical"
          cmp UNIT_TESTS/test_frun_comprehensive.sh UNIT_TESTS/test_frun_comprehensive.sh.txt
