name: sh-format
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  sh-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run the sh-checker
        uses: luizm/action-sh-checker@master
        env:
          SHELLCHECK_OPTS: -e SC1004 # exclude some shellcheck warnings.
          SHFMT_OPTS: -s -ln bash -i 4 -ci # arguments to shfmt.
        with:
          sh_checker_checkbashisms_enable: false
          sh_checker_exclude: OLD LEGACY ring_loadables/OLD
  twin-check:
    # PF-1: file twins must stay in lockstep. frun.bash <->
    # ring_loadables/frun.nob64.bash carry different embedded-b64 payloads
    # by construction (a literal cmp would false-fail), so only the
    # pre-b64-marker region is compared; the comprehensive-suite twins are
    # byte-identical with no exceptions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: File twins in lockstep
        shell: bash
        run: |
          set -euo pipefail
          echo "frun twins in lockstep (pre-b64-marker region)"
          cmp <(awk '/_BASE64_START_/{exit} {print}' frun.bash) \
              <(awk '/_BASE64_START_/{exit} {print}' ring_loadables/frun.nob64.bash)
          echo "test twins byte-identical"
          cmp UNIT_TESTS/test_frun_comprehensive.sh UNIT_TESTS/test_frun_comprehensive.sh.txt
