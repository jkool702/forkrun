name: sh-format
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  sh-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run the sh-checker
        uses: luizm/action-sh-checker@master
        env:
          SHELLCHECK_OPTS: -e SC1004 # exclude some shellcheck warnings.
          SHFMT_OPTS: -s -ln bash -i 4 -ci # arguments to shfmt.
        with:
          sh_checker_checkbashisms_enable: false
          sh_checker_exclude: OLD LEGACY ring_loadables/OLD
  twin-check:
    # W-G: file twins must stay in lockstep. frun.bash <->
    # ring_loadables/frun.nob64.bash are identical EXCEPT the single
    # `declare -A b64=` line (nob64 carries an empty map by construction —
    # a literal cmp would false-fail forever, so that one line is
    # normalized on both sides); the comprehensive-suite twins are
    # byte-identical with no exceptions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: File twins in lockstep
        shell: bash
        run: |
          set -euo pipefail
          diff <(sed -E 's/^(declare -A b64=\().*$/\1)/' frun.bash) \
               <(sed -E 's/^(declare -A b64=\().*$/\1)/' ring_loadables/frun.nob64.bash)
          echo "frun twins in lockstep"
          cmp UNIT_TESTS/test_frun_comprehensive.sh UNIT_TESTS/test_frun_comprehensive.sh.txt
          echo "test twins byte-identical"
