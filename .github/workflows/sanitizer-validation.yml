name: sanitizer-validation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sanitizer mode to validate"
        required: false
        default: "all"
        type: choice
        options: ["all", "tsan", "asan-ubsan"]
  push:
    paths:
      - 'forkrun_ring.c'
      - 'forkrun_substrate.h'
      - 'ring_loadables/forkrun_plugin.h'
      - 'META'
      - 'tools/build_sanitizer_blob.sh'
      - '.github/workflows/sanitizer-validation.yml'
      - 'python/**'
      - 'forkrun_cleanroom.c'
      - 'Makefile.substrate'
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Select sanitizer modes
    runs-on: ubuntu-latest
    outputs:
      modes: ${{ steps.select.outputs.modes }}
    steps:
      - id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            m="${{ github.event.inputs.mode }}"
          else
            m="all"
          fi
          case "$m" in
            all)        echo 'modes=["tsan","asan-ubsan"]' ;;
            tsan)       echo 'modes=["tsan"]' ;;
            asan-ubsan) echo 'modes=["asan-ubsan"]' ;;
            *) echo "::error::invalid mode: $m"; exit 2 ;;
          esac >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  bash-sanitizer:
    name: Bash loadable (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(needs.prepare.outputs.modes) }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build + embed sanitizer blobs (x86-64 v2/v3/v4)
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v $PWD:/src \
            -w /src \
            fedora:44 \
            bash -s -- "${{ matrix.mode }}" <<'CONTAINER'
          set -euo pipefail
          MODE="$1"
          dnf install -y bash-devel gcc make file diffutils
          rpm -q bash-devel
          if [ "$MODE" = "tsan" ]; then dnf install -y libtsan libtsan-static; fi
          if [ "$MODE" = "asan-ubsan" ]; then dnf install -y libasan libasan-static libubsan libubsan-static; fi
          for arch in x86-64-v2 x86-64-v3 x86-64-v4; do
            tools/build_sanitizer_blob.sh "$MODE" "$arch" "ring_loadables/forkrun-libs/forkrun_ring.${arch}.so"
          done
          # Embed into a SCRATCH wrapper (not the release frun.bash).
          set +u
          set +o pipefail
          cp frun.bash frun.san.bash
          cd ring_loadables
          source update_frun_base64.bash
          cd forkrun-libs
          update_frun_base64 /src/frun.san.bash
          cd /src
          set -euo pipefail
          # Scratch-only: remove exec -c so LD_PRELOAD survives (MAINTAINERS §5).
          sed -i 's/exec -c "${BASH:-bash}"/exec "${BASH:-bash}"/' frun.san.bash
          test -f frun.san.bash
          grep -q 'exec .*bash.*norc' frun.san.bash
          CONTAINER
          echo "embedded scratch wrapper ready"

      - name: Verify embedded payload matches sanitizer blobs
        run: |
          set -euo pipefail
          for arch in x86-64-v2 x86-64-v3 x86-64-v4; do
            key="${arch//-/_}"
            ring_loadables/verify_blob_freshness.bash \
              "ring_loadables/forkrun-libs/forkrun_ring.${arch}.so" \
              frun.san.bash "$key"
          done
          test -f frun.san.bash
          grep -q 'exec .*bash.*norc' frun.san.bash
          ! grep -q 'exec -c' frun.san.bash
          echo "provenance OK: embedded payload == freshly built sanitizer .so"

      - name: Run basic Bash suite under sanitizer
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v $PWD:/src \
            -w /src/UNIT_TESTS \
            -e SAN_MODE="${{ matrix.mode }}" \
            fedora:44 \
            bash -s <<'CONTAINER'
          set -euo pipefail
          dnf install -y bash-devel gcc make file diffutils libtsan libasan libubsan
          # Determine mode from env passed via -e
          if [ "$SAN_MODE" = "tsan" ]; then
            export LD_PRELOAD="$(ldconfig -p | grep libtsan | awk 'NR==1{print $NF}')"
          else
            export LD_PRELOAD="$(ldconfig -p | grep libasan | awk 'NR==1{print $NF}')"
            export ASAN_OPTIONS=detect_leaks=0
            export UBSAN_OPTIONS=print_stacktrace=1
          fi
          grep -q 'FRUN_SOURCE=".*/frun.san.bash"' /tmp/test_frun.san.sh 2>/dev/null || true
          # Build patched suite pointing at the scratch wrapper (shared volume).
          sed "s#FRUN_SOURCE=\\"\\$(cd \\"\\$(dirname \\"\\${BASH_SOURCE\\[0\\]}\\")\\" \\&\\& pwd)/frun.bash\\"#FRUN_SOURCE=\\"/src/frun.san.bash\\"#" /src/UNIT_TESTS/test_frun.sh > /tmp/test_frun.san.sh
          chmod +x /tmp/test_frun.san.sh
          grep -q 'FRUN_SOURCE="/src/frun.san.bash"' /tmp/test_frun.san.sh || { echo "FRUN_SOURCE substitution failed"; exit 1; }
          # Probe
          bash -c "source /src/frun.san.bash 2>&1; echo \\"ring_version type: [\\$(type -t ring_version)]\\"; frun -V" 2>&1 || true
          bash /tmp/test_frun.san.sh
          CONTAINER

      - name: Upload scratch wrapper + blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-bash-${{ matrix.mode }}
          path: |
            frun.san.bash
            ring_loadables/forkrun-libs/forkrun_ring.x86-64-*.so

  python-sanitizer:
    name: Python substrate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(needs.prepare.outputs.modes) }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build substrate + run tests under sanitizer
        run: |
          docker run --rm -i \
            -v $PWD:/src \
            -w /src \
            fedora:44 \
            bash -s -- "${{ matrix.mode }}" <<'CONTAINER'
          set -euo pipefail
          MODE="$1"
          dnf install -y git bash-devel gcc make file diffutils python3 python3-devel python3-pip libtsan libasan libubsan
          rpm -q bash-devel
          git config --global --add safe.directory /src
          if [ "$MODE" = "tsan" ]; then
            export CC="gcc -fsanitize=thread"
            export CFLAGS="-O1 -g -fPIC -Wall -Wextra -fno-omit-frame-pointer"
            export LD_PRELOAD="$(ldconfig -p | grep libtsan | awk 'NR==1{print $NF}')"
          else
            export CC="gcc -fsanitize=address,undefined"
            export CFLAGS="-O1 -g -fPIC -Wall -Wextra -fno-omit-frame-pointer"
            export LD_PRELOAD="$(ldconfig -p | grep libasan | awk 'NR==1{print $NF}')"
            export ASAN_OPTIONS=detect_leaks=0
            export UBSAN_OPTIONS=print_stacktrace=1
          fi
          make -f Makefile.substrate python-substrate CC="$CC" CFLAGS="$CFLAGS" PY_OUT=/tmp/san_substrate.so
          ls /tmp/san_substrate.so
          cd python/tests
          FORKRUN_LIB=/tmp/san_substrate.so python3 -m unittest test_v0 test_fault test_reactor test_spawn -v
          CONTAINER