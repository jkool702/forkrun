name: Build forkrun_ring.so (multiarch) and update frun.bash

on:
  push:
    paths:
      - 'forkrun_ring.c'
      - 'forkrun_substrate.h'
      - 'ring_loadables/forkrun_plugin.h'
      - 'META'
      - '.github/workflows/forkrun_release.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.arch == 'riscv64' }} 
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: The Triple Build (v2, v3, v4)
          # W-BASHCOMPAT-BC6 provenance pin (informational — changing
          # images risks a blob cycle, so the pin is documented, not
          # moved): fedora:latest resolved 2026-09 to bash 5.3-era
          # headers (see BASHCOMPAT_DIAGNOSIS.md §0.4). The build step
          # below records the resolved versions into every build log.
          - arch: x86_64
            platform: linux/amd64
            docker_image: fedora:latest
            # We handle flags manually in the script for this one
          
          # AArch64
          - arch: aarch64
            platform: linux/arm64
            docker_image: fedora:latest
            extra_flags: "-march=armv8-a+crc"
          
          # PPC64LE
          - arch: ppc64le
            platform: linux/ppc64le
            docker_image: fedora:latest
            extra_flags: ""
            
          # S390X
          - arch: s390x
            platform: linux/s390x
            docker_image: fedora:latest
            extra_flags: ""
            
          # RISC-V 64
          - arch: riscv64
            platform: linux/riscv64
            docker_image: fedorariscv/base:latest
            extra_flags: ""
            continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Docker (${{ matrix.arch }})
        run: |
          set -e
          mkdir -p artifacts
          
          # We pass variables into the Docker container via environment variables
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            --platform=${{ matrix.platform }} \
            -e TARGET_ARCH="${{ matrix.arch }}" \
            -e EXTRA_FLAGS="${{ matrix.extra_flags }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e GITHUB_REF_TYPE="${{ github.ref_type }}" \
            ${{ matrix.docker_image }} \
            bash -c '
              set -euo pipefail   # W-REL1/R5: ANY failure below fails
                                  # the job. Without this a failed
                                  # variant silently yields a partial
                                  # artifact set, and the warn-only
                                  # missing-artifact path in the
                                  # verify step ships the stale blob
                                  # the updater retained (F31 class).
              # 1. Install Dependencies (Fedora/RHEL style)
              dnf install -y @development-tools gcc make bash-devel git grep sed binutils || \
              (apt-get update && apt-get install -y gcc make libbash-dev git grep sed binutils)
              # W-BASHCOMPAT-BC6: record the resolved toolchain into the
              # log (provenance visibility for the blob-build container;
              # informational only — never gate on it here).
               echo "provenance: $(bash --version | head -1) // $(rpm -q bash-devel 2>/dev/null || echo no-bash-devel-rpm)"
               # W-GITHASH hardening: the engine includes <config.h>
               # under HAVE_CONFIG_H. If bash-devel is missing or
               # incomplete, the gcc error ("config.h: No such file")
               # looks like a flags problem and invites blaming the
               # most recent workflow edit. Fail here instead, with the
               # actual cause named.
               if [ ! -f /usr/include/bash/config.h ]; then
                 echo "ERROR: bash-devel headers incomplete (/usr/include/bash/config.h missing); cannot build loadable" >&2
                 exit 1
               fi

              # 2. Extract Version from META
              FR_VERSION="unknown"
              if [ -f META ]; then
                 FR_VERSION=$(grep -E "^VERSION:" META | sed -E "s/^VERSION:[ \t]*//")
              fi
               echo "Compiling Version: $FR_VERSION"

               # 2b. Derive the git provenance for ring_version -h
               # (v3.6.0 W-GITHASH). Computed once HERE, never inside
               # build_variant(): the freshness gate byte-compares two
               # builds seconds apart, so this value must be identical
               # for both — it rides the same "${DEFS[@]}" mechanism as
               # the other four. GITHUB_SHA/REF_TYPE arrive via the -e
               # passthrough above; ${...:-} guards keep `set -u` happy
               # on manual (non-GitHub) container runs, where the value
               # must degrade to "unknown", not abort the build.
               FR_GIT_HASH="${GITHUB_SHA:-}"
               if [ -n "$FR_GIT_HASH" ]; then
                 FR_GIT_HASH="${FR_GIT_HASH:0:12}"
                 if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
                   FR_GIT_HASH="$FR_VERSION+git.$FR_GIT_HASH"
                 fi
               else
                 FR_GIT_HASH="unknown"
               fi
               echo "Git hash: $FR_GIT_HASH"

               # 3. Define Common Flags
               # -ffile-prefix-map mirrors Makefile.substrate (same
               # intent; in-container the tree is at /src): pin __FILE__
               # so the artifact doesn't embed the build path. This also
               # flows into COMPILER_FLAGS below, so ring_version -f
               # shows the reproducibility flag alongside the rest.
               OPT_FLAGS="-O3 -flto=auto -fno-strict-aliasing -fno-semantic-interposition -fomit-frame-pointer -fno-math-errno -ftree-loop-im -ftree-loop-ivcanon -fPIC -Wl,-O1 -Wl,--as-needed -Wl,-Bsymbolic -ldl -ffile-prefix-map=/src=."
              WARN_FLAGS="-DNDEBUG -Wall -Wextra "
              INCLUDES="-I/usr/include/bash -I/usr/include/bash/include -I/usr/include/bash/builtins "
              
               DEFS=(
                  "-DSHELL"
                  "-DHAVE_CONFIG_H"
                  "-DBUILD_OS=\"Linux\""
                  "-DFORKRUN_RING_VERSION=\"$FR_VERSION\""
                  "-DCOMPILER_FLAGS=\"$OPT_FLAGS\""
                  # v3.6.0 W-GITHASH: provenance for ring_version -h.
                  # Value computed once above (never in the build loop)
                  # so the freshness byte-compare stays exact.
                  "-DGIT_HASH=\"$FR_GIT_HASH\""
                  # W-REL1/R5: pin the wall-clock macros (same values
                  # as Makefile.substrate) so builds are
                  # byte-reproducible — the freshness gate below
                  # byte-compares a clean rebuild against these
                  # artifacts. Informational strings only; the
                  # quoting rides the same "${DEFS[@]}" mechanism as
                  # the entries above.
                  "-D__DATE__=\"Sep  1 2026\""
                  "-D__TIME__=\"00:00:00\""
               )
              
              # Function to build specific variant
              build_variant() {
                 local arch_name="$1"
                 local march_flag="$2"
                 local out_file="artifacts/forkrun_ring.${arch_name}.so"
                 
                 echo ">>> Building $arch_name..."
                 
                 # Dynamic Arch Definition
                 local ARCH_DEF="-DBUILD_ARCH=\"$arch_name\""
                 
                 gcc forkrun_ring.c \
                    $OPT_FLAGS $WARN_FLAGS $INCLUDES \
                    "${DEFS[@]}" "$ARCH_DEF" \
                    -shared \
                    $march_flag \
                    -o "$out_file"
                 
                  strip --strip-unneeded "$out_file"
                  
                   # SANITY CHECK: Try to enable and run version check
                   echo ">>> Testing loadable..."
                   enable -f "$out_file" ring_version && \
                   ring_version -a || exit 1
                   # W-GITHASH: the artifact about to ship inside
                   # frun.bash must carry provenance. ring_version -h
                   # prints the bare GIT_HASH (exact line match); the
                   # "unknown" fallback means the -e passthrough above
                   # broke and this must fail loudly, not ship quiet.
                   if ring_version -h | grep -qxF "unknown"; then
                     echo "ERROR: GIT_HASH not baked into $arch_name" >&2
                     exit 1
                   fi
                   enable -d ring_version

                  # W-REL3/R5 freshness gate (colocated): rebuild the
                  # identical variant from current source and
                  # byte-compare. Same container/toolchain/headers/flags
                  # seconds apart, so any divergence is stale source or
                  # nondeterminism (the __DATE__/__TIME__ pins in DEFS
                  # make it exact) — mismatch fails the job, making
                  # stale-engine shipping structurally impossible.
                  # (Colocated deliberately: a separate-container
                  # rebuild proved sensitive to image/toolchain drift
                  # between docker runs, i.e. false-positive-prone.)
                  echo ">>> Freshness rebuild $arch_name..."
                  gcc forkrun_ring.c \
                     $OPT_FLAGS $WARN_FLAGS $INCLUDES \
                     "${DEFS[@]}" "$ARCH_DEF" \
                     -shared \
                     $march_flag \
                     -o "$out_file.fresh"
                  strip --strip-unneeded "$out_file.fresh"
                  if cmp -s "$out_file.fresh" "$out_file"; then
                     echo "FRESH-OK: $arch_name rebuild == artifact"
                  else
                     echo "FRESH-FAIL: $arch_name rebuild differs (stale source or nondeterministic build)" >&2
                     rm -f "$out_file.fresh"
                     exit 1
                  fi
                  rm -f "$out_file.fresh"
               }

              # 4. Logic Branch based on Architecture
              if [ "$TARGET_ARCH" == "x86_64" ]; then
                  # The Triple Build
                  build_variant "x86-64-v2" "-march=x86-64-v2"
                  build_variant "x86-64-v3" "-march=x86-64-v3"
                  build_variant "x86-64-v4" "-march=x86-64-v4"
              else
                  # Single Build
                  build_variant "$TARGET_ARCH" "$EXTRA_FLAGS"
              fi
              
              ls -l artifacts/
            '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forkrun-libs-${{ matrix.arch }}
          path: artifacts/*.so

  embed:
    name: Embed Base64 into frun.bash
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Flatten Artifacts and Update frun.bash
        shell: bash
        run: |
          set +e              # Turn off exit-on-error 
          set +o pipefail     # Turn off pipefail
          
          # 1. Ensure target directory exists
          mkdir -p ring_loadables/forkrun-libs
          
          # 2. Move all downloaded .so files into the target directory, overwriting old ones
          find all_artifacts -name "*.so" -exec mv -f {} ring_loadables/forkrun-libs/ \;
          
          # 3. Source the updater and run it
          # Assuming update_frun_base64.bash defines the function 'update_frun_base64'
          cd ring_loadables
          source update_frun_base64.bash
          
          cd forkrun-libs
          update_frun_base64 ../../frun.bash
          
          # 4. Clean up downloaded artifacts to keep working tree clean for the PR
          cd ../../
          rm -rf all_artifacts

      - name: Verify Final Script
        shell: bash
        run: |
          # Sanity check: Does the script run and load on the runner?
          . ./frun.bash && ring_version -a || echo 'WARNING: frun.bash may not have been properly updated' >&2

      - name: Verify embedded blobs match built artifacts
        shell: bash
        run: |
          # W-F provenance gate: the update step above runs under `set +e`,
          # so a silently failed update_frun_base64 would still reach the PR
          # step with stale blobs. For every architecture with a built
          # artifact, the payload embedded in the updated frun.bash must
          # decode (via the repo's own decoder, checksums enforced) to bytes
          # identical to that artifact. Mismatch ALWAYS fails. A missing
          # artifact fails on tag refs (releases must ship every arch) and
          # warns otherwise (riscv64 is continue-on-error).
          #
          # NOTE (deviation from the first sketch, which asked for a
          # regen-and-byte-compare): the encoder gzip-compresses with an
          # embedded mtime, so two encodings of the SAME .so never compare
          # equal and a regen-compare false-fails on every run (demonstrated
          # locally). Decode-and-cmp proves the same correspondence —
          # embedded bytes == artifact bytes — deterministically.
          set -euo pipefail
          # Repo machinery, sourced from the UPDATED frun.bash (function defs
          # only — never source the whole file here). Extraction runs to the
          # first column-0 `}` after each opener (both functions end there).
          . <( { capture=false; while IFS= read -r line; do
            case "$line" in
              *'_forkrun_file_to_base64() {'*|*'_forkrun_base64_to_file() {'*) capture=true;;
            esac
            $capture && printf '%s\n' "$line"
            $capture && [[ "$line" == '}' ]] && capture=false
          done; } <./frun.bash )
          # Embedded map: eval ONLY the declare region between the
          # _BASE64_START_ marker and the bootstrap line.
          unset b64; declare -A b64=()
          eval "$(awk '/_BASE64_START_/{f=1;next} /_forkrun_bootstrap_setup/{f=0} f' ./frun.bash)"
          # NOTE: the codec functions are foreign code that is not
          # nounset-clean, so each call runs with its native options
          # (subshell-scoped); the comparisons below remain the hard gate —
          # a failed decode/regeneration can never compare equal.
          expected=(x86_64_v2 x86_64_v3 x86_64_v4 aarch64 ppc64le s390x riscv64)
          fail=0
          tmpd="$(mktemp -d)"
          for key in "${expected[@]}"; do
            artifact="ring_loadables/forkrun-libs/forkrun_ring.${key//_/-}.so"
            if [[ ! -f "$artifact" ]]; then
              if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
                echo "VERIFY-FAIL: missing artifact $artifact on a tag ref" >&2; fail=1
              else
                echo "VERIFY-WARN: missing artifact $artifact (non-tag ref; skipping)" >&2
              fi
              continue
            fi
            if [[ -z "${b64[$key]:-}" ]]; then
              echo "VERIFY-FAIL: frun.bash carries no embedded b64[$key]" >&2; fail=1; continue
            fi
            rm -f "$tmpd/out.so"
            if (set +e +u; _forkrun_base64_to_file <<<"${b64[$key]}" "$tmpd/out.so" 2>/dev/null); then
              if cmp -s "$tmpd/out.so" "$artifact"; then
                echo "VERIFY-OK: b64[$key] decodes to $artifact"
              else
                echo "VERIFY-FAIL: embedded b64[$key] decodes to bytes differing from $artifact (stale blob)" >&2; fail=1
              fi
            else
              echo "VERIFY-FAIL: embedded b64[$key] failed to decode/verify" >&2; fail=1
            fi
          done
           rm -rf "$tmpd"
           exit "$fail"

      - name: Substrate canary (zero bash linkage)
        shell: bash
        run: |
          # Fedora for everything: the link check runs in fedora:latest
          # (native x86_64, no QEMU needed), where bash-devel exists —
          # ubuntu runners carry no bash headers package. Canary artifacts
          # are gitignored, so the workspace stays PR-clean.
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            fedora:latest \
            bash -c 'dnf install -y bash-devel gcc make file && make -f Makefile.substrate canary'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build: update embedded ring loadables"
          title: "🤖 Auto-Build: Update Ring Loadables"
          body: |
            This PR updates the embedded `forkrun_ring` binaries.
            Generated by GitHub Actions Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Architectures:**
            - x86_64 (v2, v3, v4)
            - aarch64, ppc64le, s390x, riscv64
          # Append the run_id to guarantee a unique branch name every time!
          branch: "auto-build/update-loadables-${{ github.run_id }}"
          delete-branch: true
